arena-reset:
  enabled: true
  # Delay (dalam tick) sebelum arena di-reset setelah match selesai (20 ticks = 1 detik)
  reset-delay-ticks: 40
  # Jika true, pembersihan item tercecer di arena akan dilakukan setelah paste
  clear-dropped-items: true
  # Radius pembersihan entity (item/arrow) dari titik paste
  clear-radius: 50

