name: Build DuelsAddon

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Download & Install Duels Dependency to Local Maven
      run: |
        curl -sL "https://jitpack.io/com/github/dumbo-the-developer/Duels/master-SNAPSHOT/Duels-master-SNAPSHOT.jar" -o Duels.jar || true
        if [ -f Duels.jar ]; then
          mvn install:install-file -Dfile=Duels.jar -DgroupId=com.github.dumbo-the-developer -DartifactId=Duels -Dversion=master-SNAPSHOT -Dpackaging=jar
        fi

    - name: Build with Maven
      run: mvn clean package --file pom.xml

    - name: Upload Compiled JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuelsAddon-Build
        path: target/*.jar
