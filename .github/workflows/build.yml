name: Build DuelsAddon

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Addon Repository
      uses: actions/checkout@v4

    - name: Checkout Duels Source Repository
      uses: actions/checkout@v4
      with:
        repository: 'dumbo-the-developer/Duels'
        path: 'duels-src'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Duels API to Local Maven Repository
      run: |
        cd duels-src
        mvn clean install -DskipTests
        cd ..

    - name: Build DuelsAddon with Maven
      run: mvn clean package --file pom.xml

    - name: Upload Compiled JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuelsAddon-Build
        path: target/*.jar
